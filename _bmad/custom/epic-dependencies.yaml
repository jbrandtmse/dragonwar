# Epic dependency graph for /epic-cycle orchestrator mode.
# Derived from epics.md + ARCHITECTURE-SPINE.md (AD-1..AD-17) + PRD; approved by the user 2026-08-27.
#
# Waves that fall out of this graph:
#   1 -> 2 -> (3 || 5) -> 4 -> 6
# max_parallel_epics is 2 (parallel.yaml), so wave 3 is the only concurrency in the range.
#
# DragonWar has no submodules (.gitmodules absent; parallel.yaml submodule_mode: none),
# so every `submodules:` list is empty.

epics_md_hash: "4c336f68e8954f63486db85173692d5cc4be51b9d470f8ded816856edc0668cf"
analyzed_by: claude-opus-5
approved: true
approved_date: 2026-08-27
hash_rerecorded: 2026-08-30  # Epic 1 close: Story 1.10 (burn-down) inserted + 4 AC/prose amendments.
                            # Structural diff vs approval: ONE added story heading under Epic 1.
                            # Epic boundaries, story-to-epic assignment and dependency statements unchanged.
                            # Hash-exempt per the kit -- re-recorded without re-approval.

epics:
  epic-1:
    depends_on: []
    submodules: []
    paths_hint:
      - "src/**"
      - "test/**"
      - "tools/**"
      - "assets/src/**"
      - ".github/workflows/**"
      - "package.json"
    rationale: >-
      Greenfield. Story 1.3 lays out the entire source tree, the closed seam contracts,
      the TABLE registry and the dependency-cruiser boundary lint. Nothing can precede it.

  epic-2:
    depends_on: [epic-1]
    submodules: []
    paths_hint:
      - "src/sim/table/**"
      - "src/sim/rules/**"
      - "src/presentation/backglass/**"
      - "assets/src/**"
    rationale: >-
      Consumes epic-1's contracts, physics loop and export pipeline. Owns the full switch
      and device set in src/sim/table/dragonwar.ts.

  epic-3:
    depends_on: [epic-2]
    submodules: []
    paths_hint:
      - "src/sim/rules/modes/**"
      - "src/sim/table/**"
    rationale: >-
      Modes sit on the devices-and-shots layer (2.4), the ball lifecycle (2.5), the DMD (2.6)
      and the Lock in physics (2.3). Heavy overlap with epic-2 on src/sim/rules/.

  epic-4:
    depends_on: [epic-3]
    submodules: []
    paths_hint:
      - "src/presentation/lighting/**"
      - "src/presentation/audio/**"
      - "src/sim/table/**"
    rationale: >-
      Soft serialization edge, above footprint_overlap_threshold. Story 4.5 needs epic-3's
      modes, but the binding reason is that epics 2, 3 and 4 all extend the single
      `TABLE as const` in src/sim/table/dragonwar.ts (plus names.ts and tuning.ts). The
      boundary lint makes a device-name literal illegal anywhere else, so that file cannot
      be partitioned and concurrent epics would collide on it.

  epic-5:
    depends_on: [epic-2]
    submodules: []
    paths_hint:
      - "assets/src/**"
      - "public/assets/**"
      - "src/presentation/mechanisms/**"
      - "src/presentation/scene/**"
      - "ATTRIBUTIONS.md"
    rationale: >-
      Art passes fit the geometry frozen by epic-2 (2.1) and the DMD (2.6), and are decoupled
      from rules work by the fixed node contract from epic-1 -- each pass replaces placeholder
      primitives behind the same node names. AR-4 states art is "phased, allowed to trail,
      never blocking epics 1-4", which is what licenses running it alongside epic-3.
      Writes assets and presentation materials, never src/sim/.

  epic-6:
    depends_on: [epic-4, epic-5]
    submodules: []
    paths_hint:
      - "src/host/**"
      - ".github/workflows/**"
      - "index.html"
      - "ATTRIBUTIONS.md"
    rationale: >-
      Release epic. Story 6.6's browser matrix and 6.7's attribution-ledger audit and
      v1.0.0 tag span every prior epic's output.
