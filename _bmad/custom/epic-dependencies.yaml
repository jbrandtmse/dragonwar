# Epic dependency graph for /epic-cycle orchestrator mode.
# Derived from epics.md + ARCHITECTURE-SPINE.md (AD-1..AD-17) + PRD; approved by the user 2026-08-27.
#
# Waves that fall out of this graph:
#   1 -> 2 -> (3 || 5) -> 4 -> 6
# max_parallel_epics is 2 (parallel.yaml), so wave 3 is the only concurrency in the range.
#
# DragonWar has no submodules (.gitmodules absent; parallel.yaml submodule_mode: none),
# so every `submodules:` list is empty.

