#
# Story 1.2, Spike 3 -- the minimum CI this story owns (AR-34 "minimum CI";
# AD-17): install, typecheck, test, build, the static-bundle check and the
# size budget on every push and pull request, plus a deploy job that
# publishes dist/ to GitHub Pages. Story 1.3 extends the checks job with
# dependency-cruiser, the per-file licence-header check and the SHA stamp.
#
# NARROWED BACK, Story 1.2's seventh acceptance criterion: the deploy job
# briefly also triggered on this epic's own branch (in addition to `main` and
# `workflow_dispatch`), purely so Spike 3 could measure a real live Pages
# deployment before Epic 1 merged. Every measurement that trigger enabled is
# recorded in docs/spikes/spike-3.md, including the sentence stating that
# artifact was provisional until this workflow reran from `main`. This
# restores AD-17 / AR-34's `main`-only shipping rule.
#
# Action versions below are each pinned to their current major release tag
# (resolved via `gh api repos/<owner>/<repo>/releases/latest` on 2026-08-27),
# never floating on a branch.
#
# Story 1.3: `on.push` is widened to every branch (checks only -- the deploy
# job's own `if:` guard below is untouched and still restricts publishing to
# `main`), so a push to any branch gets the full check set, not only `main`
# and pull requests. The workflow-level `concurrency` group also moves to a
# per-ref group so pushing again to the same branch cancels a stale in-flight
# `checks` run instead of queuing behind it -- but `cancel-in-progress` is
# conditional on the ref NOT being `main`: workflow-level cancellation
# terminates the ENTIRE run it supersedes, every job in it, regardless of that
# job's OWN concurrency settings -- so an unconditional `cancel-in-progress:
# true` here would cancel the `deploy` job mid-Pages-publish on a second quick
# push to `main`, defeating the very protection the `deploy` job's own
# `group: pages, cancel-in-progress: false` block below exists to provide
# (job-level concurrency only arbitrates between separate runs that are both
# still alive -- it cannot save a job whose own run was just cancelled out
# from under it). `main` is the only ref that ever reaches `deploy`, so
# excluding it here is sufficient; every other ref still gets the dedup this
# story's own I/O matrix asks for (review finding, this story's own review
# pass -- confirmed independently by three reviewers).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Story 1.4: this workflow deliberately adds NO step that shells out to
# Blender. `ubuntu-latest` has no Blender installed, and the asset export
# pipeline (`pnpm export:assets`, tools/export.py) is a LOCAL AUTHORING STEP
# only -- the committed `public/assets/dragonwar.glb` and
# `public/assets/dragonwar.collision.json` are what the `checks` job below
# actually consumes (via `pnpm build`, `pnpm test`, etc.). Every
# Blender-dependent test (test/export-py.test.ts) resolves Blender through
# `tools/blender.mjs` and reports itself SKIPPED, not failed, when none is
# found -- exactly what happens here -- so this job stays green with no
# Blender in sight. An unwritten rule here is one a later story could easily
# break by "helpfully" adding an export step; this comment is that guard.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # Story 1.8 (CI parity, AD-17): pinned from the floating `24` to the
          # exact version this story's replay goldens were recorded on
          # (local `node --version` this pass: v24.16.0) -- AD-15's own state
          # hash is FNV-1a over canonical JSON, which is exact and
          # deterministic across Node builds on the SAME major/minor, but
          # V8's transcendental math (Math.sin/cos, used by the ball-hit
          # collision response) is not specified to be bit-identical ACROSS
          # V8 versions. Pinning the exact patch CI runs on is the honest fix
          # for a hash-exact golden replay; bumping this is a deliberate act
          # (re-verify the goldens still reproduce, then update the pin).
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: @swc/core is the only package in this project's
        # dependency tree with an install-time script (a postinstall
        # fallback check that installs @swc/wasm if the platform's native
        # binary cannot load) -- verified during this story's implementation.
        # pnpm's newer supply-chain gate refuses to run ANY install script
        # without an explicit `pnpm approve-builds`, which would need a
        # `pnpm-workspace.yaml` outside this story's declared footprint;
        # `--ignore-scripts` is the in-footprint fix, and it is safe here
        # because the native `@swc/core` binary pnpm resolves as a matching
        # platform optionalDependency needs no build step to load (confirmed:
        # `dependency-cruise --info` reports swc available with no build
        # having run).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Boundary lint
        run: pnpm lint:boundaries

      - name: Licence headers
        run: pnpm check:headers

      - name: Attribution ledger
        run: pnpm check:attributions

      - name: Test
        run: pnpm test

      - name: Build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Static-bundle check (CSP, relative paths, no inline, no service worker, notices, SHA stamp)
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: pnpm check:dist

      - name: Size budget
        run: pnpm check:size

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: checks
    # Both conditions, not just the event: `workflow_dispatch` can be fired from
    # ANY branch, so an event-only guard still let an unmerged epic branch ship
    # to Pages -- which is how this spike's own deployment happened, and it
    # stayed open after the trigger narrow-back (review finding 2026-08-28;
    # ledger DW-18 tracks the separate `github-pages` Environment setting, which
    # is a repository setting no workflow file can close).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
